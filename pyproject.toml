[project]
name = "deepdoc-vietocr"
version = "1.0.0"
description = "Công cụ nhận dạng chữ Tiếng Việt tối ưu kết hợp DeepDoc và VietOCR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0,<2.0.0",       # Đảm bảo tương thích với PaddlePaddle 3.x/2.x
    "opencv-python>=4.8.0.76",
    "onnxruntime>=1.16.3",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "pdfplumber>=0.10.2",
    "huggingface-hub>=0.19.4",
    "shapely>=2.0.2",
    "pyclipper>=1.3.0.post5",
    "ruamel.yaml>=0.18.5",
    "cachetools>=5.3.2",
    "six>=1.16.0",
    "trio>=0.33.0",
    "requests>=2.34.2",
    "pycryptodomex>=3.23.0",
    "strenum>=0.4.15",
    "vietocr>=0.3.12",
    "fastapi>=0.138.1",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
]
