services:
  ocr-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vnm-ocr-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Vietnamese OCR & Document Extraction Service
      - ENVIRONMENT=production
      - DEBUG=false
      - MODELS_DIR=/app/models
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
